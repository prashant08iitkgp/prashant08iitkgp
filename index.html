<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prashant Sagar</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root { --bg: #f7f7f5; --card: #fff; --ink: #1f2328; --muted: #6b7280; --line: #e5e5e5; --accent: #58cc02; }
@media (prefers-color-scheme: dark) { :root { --bg: #131f24; --card: #1b2b33; --ink: #e8eef1; --muted: #93a4ad; --line: #2e424c; } }
body { margin: 0; background: var(--bg); color: var(--ink); font: 600 16px/1.5 Nunito, system-ui, sans-serif; }
main { max-width: 760px; margin: 0 auto; padding: 48px 16px; }
h1 { font-size: 2rem; font-weight: 900; margin: 0; } p { color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; margin-top: 28px; }
.tile { display: block; background: var(--card); border: 2px solid var(--line); border-bottom-width: 5px; border-radius: 18px; padding: 18px; color: var(--ink); text-decoration: none; }
.tile b { display: block; font-size: 1.15rem; } .tile span { font-size: 2rem; } .tile small { color: var(--muted); }
.tile.soon { opacity: .5; border-style: dashed; }
</style>
</head>
<body>
<main>
  <h1>Prashant Sagar</h1>
  <p>Personal workspace. New sections get added here one by one.</p>
  <div class="grid">
    <a class="tile" href="german/"><span>🇩🇪</span><b>Deutsch A1 → C1</b><small>Goethe exam course with tests and progress</small></a>
    <div class="tile soon"><span>➕</span><b>Next section</b><small>Coming soon</small></div>
  </div>
</main>
</body>
</html>
